<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ofis Odası</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z' fill='%23c75d3f'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Fraunces', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(180deg, #f7f3ec 0%, #efe7d8 100%);
    min-height: 100vh;
    color: #2a2418;
  }
  button { font-family: inherit; }
  input, textarea {
    font-family: inherit;
    border: 1px solid #d9cfb8;
    border-radius: 2px;
    background: #fcf8ef;
    padding: 12px 14px;
    font-size: 16px;
    color: #2a2418;
    outline: none;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 90px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #8a7a5b; display: block; margin-bottom: 8px;
  }
  .card {
    background: #fffdf8; border: 1px solid #d9cfb8; border-radius: 4px;
    box-shadow: 0 30px 60px -30px rgba(80, 60, 30, 0.25);
  }
  .btn-primary {
    width: 100%; padding: 14px 20px; background: #2a2418; color: #fcf8ef;
    border: none; border-radius: 2px; font-size: 14px;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.18em;
    text-transform: uppercase; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 10px; transition: opacity 0.2s;
  }
  .btn-primary:disabled { background: #aaa090; cursor: not-allowed; }
  .btn-primary:hover:not(:disabled) { opacity: 0.92; }
  .btn-ghost {
    padding: 10px 18px; background: transparent; border: 1px solid #d9cfb8;
    border-radius: 2px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    color: #6e6147; transition: all 0.2s; display: inline-flex;
    align-items: center; gap: 8px;
  }
  .btn-ghost:hover { background: #2a2418; color: #fcf8ef; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #d9cfb8; border-top-color: #c75d3f;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cells {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
    background: #2a2418; padding: 2px; border-radius: 2px;
    box-shadow: 0 20px 50px -20px rgba(80, 60, 30, 0.4);
  }
  .cell {
    width: 92px; height: 92px; background: #fcf8ef; border: none;
    margin: 1px; cursor: default; display: flex; align-items: center;
    justify-content: center; transition: background 0.2s; padding: 0;
  }
  .cell.playable { cursor: pointer; }
  .cell.playable:hover { background: #fff3df; }
  .cell.winning { background: #fff7ec; }
  .cell svg { animation: pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
  .tabs { display: flex; border-bottom: 1px solid #e3d9c1; background: #fcf8ef; }
  .tab {
    flex: 1; padding: 16px 20px; background: transparent; border: none;
    border-bottom: 2px solid transparent; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase; color: #8a7a5b;
    transition: all 0.2s;
  }
  .tab.active { background: #fffdf8; color: #2a2418; border-bottom-color: #c75d3f; }
  .chat-scroll { height: 380px; overflow-y: auto; padding: 20px 24px; background: #fcf8ef; }
  .msg { display: flex; margin-bottom: 14px; align-items: flex-end; gap: 8px; }
  .msg.mine { flex-direction: row-reverse; }
  .msg-meta {
    display: flex; gap: 8px; align-items: baseline; margin-bottom: 3px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; color: #8a7a5b; text-transform: uppercase;
  }
  .msg.mine .msg-meta { flex-direction: row-reverse; }
  .msg-bubble {
    padding: 10px 14px; border-radius: 2px; font-size: 14px; line-height: 1.5;
    word-wrap: break-word; background: #fff; color: #2a2418; border: 1px solid #e3d9c1;
  }
  .msg.mine .msg-bubble { background: #2a2418; color: #fcf8ef; border: none; }
  .player-badge {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    border: 1px solid transparent; transition: all 0.3s;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5;
  }
  .player-badge.active { opacity: 1; }
  .player-badge.x.active { background: #fdebe2; border-color: #c75d3f; }
  .player-badge.o.active { background: #e4ede7; border-color: #3a6b54; }
  .setup-step { border-left: 2px solid #d9cfb8; padding-left: 20px; margin-bottom: 22px; position: relative; }
  .setup-step::before {
    content: counter(step); counter-increment: step; position: absolute;
    left: -14px; top: 0; width: 26px; height: 26px; background: #c75d3f;
    color: #fff; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 600;
  }
  .setup-steps { counter-reset: step; }
  .alert { padding: 12px 14px; border-radius: 2px; margin-top: 12px; font-size: 13px; line-height: 1.5; }
  .alert-error { background: #fdebe2; color: #8a3525; border: 1px solid #f0c2b2; }
  .alert-info { background: #e8e2d4; color: #5a4f38; border: 1px solid #d9cfb8; }
  .alert-ok { background: #e4ede7; color: #2f5743; border: 1px solid #bcd4c6; }
  .hint { font-size: 12px; color: #9a8a6b; margin: 8px 0 0 0; font-style: italic; }
  a { color: #c75d3f; }
  code {
    background: #efe7d8; padding: 1px 5px; border-radius: 2px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.88em;
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- Firebase SDK (compat build — tek global, modül gerekmez) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// =============================================================================
//  >>> BURAYA FIREBASE AYARLARINI YAPIŞTIR <<<
//  Eğer aşağısı boşsa, site açılınca seni kurulum ekranına götürür.
//  Kurulumu bir kere yapınca buraya yazabilirsin (kalıcı olur) — README'de anlatılıyor.
// =============================================================================
const FIREBASE_CONFIG = {
  // apiKey: "...",
  // authDomain: "...",
  // databaseURL: "https://...",
  // projectId: "...",
};

// =============================================================================
//  AYARLAR
// =============================================================================
const DEFAULT_ROOM = "EMINEVIIM";
const STORAGE_NS = "ofis_odasi_fb_v1";

const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(STORAGE_NS + "_" + k)); } catch { return null; } };
const lsSet = (k, v) => localStorage.setItem(STORAGE_NS + "_" + k, JSON.stringify(v));

let myId = lsGet("user_id");
if (!myId) {
  myId = "u_" + Math.random().toString(36).slice(2, 10) + "_" + Date.now().toString(36);
  lsSet("user_id", myId);
}

function resolveConfig() {
  if (FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL) return FIREBASE_CONFIG;
  const saved = lsGet("fb_config");
  if (saved && saved.databaseURL) return saved;
  return null;
}

// =============================================================================
//  OYUN MANTIĞI
// =============================================================================
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function checkWinner(cells) {
  for (const [a,b,c] of LINES) {
    if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) return { winner: cells[a], line: [a,b,c] };
  }
  if (cells.every(Boolean)) return { winner: null, line: null, draw: true };
  return { winner: null, line: null, draw: false };
}
function emptyBoard(starter) {
  // starter: yeni oyuna kim başlıyor ("X" veya "O"). Verilmezse X.
  const first = (starter === "O") ? "O" : "X";
  return { cells: ["","","","","","","","",""], turn: first, winner: "", line: [], draw: false, ts: 0 };
}

// --- HANGMAN ---
// Türkçe kelime havuzu (ipucu ile birlikte)
const HANGMAN_WORDS = [
  { w: "BİLGİSAYAR", h: "Teknoloji" },
  { w: "KAHVE", h: "İçecek" },
  { w: "TOPLANTI", h: "İş hayatı" },
  { w: "İSTANBUL", h: "Şehir" },
  { w: "ANKARA", h: "Şehir" },
  { w: "KLAVYE", h: "Ofis eşyası" },
  { w: "PROJE", h: "İş hayatı" },
  { w: "TELEFON", h: "Teknoloji" },
  { w: "MÜDÜR", h: "İş hayatı" },
  { w: "PENCERE", h: "Ev/ofis" },
  { w: "ASANSÖR", h: "Bina" },
  { w: "FATURA", h: "İş hayatı" },
  { w: "RAPOR", h: "İş hayatı" },
  { w: "MOLA", h: "İş hayatı" },
  { w: "YAZILIM", h: "Teknoloji" },
  { w: "MÜŞTERİ", h: "İş hayatı" },
  { w: "DEFTER", h: "Kırtasiye" },
  { w: "KALEM", h: "Kırtasiye" },
  { w: "SANDALYE", h: "Mobilya" },
  { w: "MASA", h: "Mobilya" },
  { w: "EKRAN", h: "Teknoloji" },
  { w: "İNTERNET", h: "Teknoloji" },
  { w: "ARABA", h: "Ulaşım" },
  { w: "OTOBÜS", h: "Ulaşım" },
  { w: "TATİL", h: "Keyif" },
  { w: "BAYRAM", h: "Özel gün" },
  { w: "ÇİLEK", h: "Meyve" },
  { w: "KARPUZ", h: "Meyve" },
  { w: "DENİZ", h: "Doğa" },
  { w: "ORMAN", h: "Doğa" },
  { w: "YAĞMUR", h: "Hava" },
  { w: "GÜNEŞ", h: "Hava" },
  { w: "KÖPEK", h: "Hayvan" },
  { w: "KEDİ", h: "Hayvan" },
  { w: "PROGRAMCI", h: "Meslek" },
  { w: "MÜHENDİS", h: "Meslek" },
  { w: "ÖĞRETMEN", h: "Meslek" },
  { w: "DOKTOR", h: "Meslek" },
  { w: "PİZZA", h: "Yemek" },
  { w: "KEBAP", h: "Yemek" },
];
const HANGMAN_ALPHABET = "ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ".split("");
const HANGMAN_MAX_WRONG = 6;

function pickHangmanWord() {
  return HANGMAN_WORDS[Math.floor(Math.random() * HANGMAN_WORDS.length)];
}
function newHangman() {
  const pick = pickHangmanWord();
  return {
    word: pick.w,
    hint: pick.h,
    guessed: [],        // tahmin edilen harfler
    wrong: 0,           // yanlış sayısı
    status: "playing",  // playing | won | lost
    lastBy: "",         // son harfi kim tahmin etti
    ts: Date.now(),
  };
}
// Bir kelimenin tamamı bilindi mi?
function hangmanSolved(word, guessed) {
  for (const ch of word) {
    if (ch === " ") continue;
    if (guessed.indexOf(ch) === -1) return false;
  }
  return true;
}

// =============================================================================
//  DOM YARDIMCILARI
// =============================================================================
const $app = document.getElementById("app");
function el(tag, attrs, ...children) {
  attrs = attrs || {};
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (k === "class") e.className = v;
    else if (k === "style") Object.assign(e.style, v);
    else if (k.slice(0,2) === "on" && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "html") e.innerHTML = v;
    else if (v != null && v !== false) e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}
function svgStar(size, color) {
  size = size || 22; color = color || "#c75d3f";
  const w = document.createElement("span");
  w.style.display = "inline-flex";
  w.innerHTML = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" style="display:block"><path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z" fill="'+color+'"/></svg>';
  return w;
}
function svgCircle(size, color) {
  size = size || 22; color = color || "#3a6b54";
  const w = document.createElement("span");
  w.style.display = "inline-flex";
  w.innerHTML = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" style="display:block"><circle cx="12" cy="12" r="7.5" stroke="'+color+'" stroke-width="2.6" fill="none"/></svg>';
  return w;
}
const clear = () => { $app.innerHTML = ""; };

// =============================================================================
//  EKRAN: KURULUM
// =============================================================================
function screenSetup() {
  clear();
  let cfgText = "";

  const root = el("div", { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "24px" } });
  const card = el("div", { class: "card", style: { width: "100%", maxWidth: 560, padding: "44px 36px" } });

  const header = el("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 24 } },
    svgStar(26),
    el("span", { class: "mono", style: { fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "#8a7a5b" } }, "Ofis Odası — İlk Kurulum"),
  );
  const title = el("h1", { style: { fontSize: 30, fontWeight: 400, letterSpacing: "-0.02em", margin: 0, marginBottom: 8, lineHeight: 1.1 } }, "Firebase'e bağlan");
  const subtitle = el("p", { style: { color: "#6e6147", margin: 0, marginBottom: 26, fontStyle: "italic" } }, "Bunu sadece bir kere yaparsın. Yaklaşık 5 dakika, kart bilgisi yok.");

  const steps = el("div", { class: "setup-steps" },
    el("div", { class: "setup-step" },
      el("div", { style: { fontSize: 15, marginBottom: 6 } }, "Firebase projesi aç"),
      el("p", { style: { fontSize: 13.5, color: "#6e6147", margin: 0, lineHeight: 1.55 } },
        "→ ", el("a", { href: "https://console.firebase.google.com", target: "_blank", rel: "noopener" }, "console.firebase.google.com"),
        " → ", el("strong", null, "Add project"), " → bir isim ver → Analytics'i kapat → Create.",
      ),
    ),
    el("div", { class: "setup-step" },
      el("div", { style: { fontSize: 15, marginBottom: 6 } }, "Realtime Database oluştur"),
      el("p", { style: { fontSize: 13.5, color: "#6e6147", margin: 0, lineHeight: 1.55 } },
        "→ Sol menü ", el("strong", null, "Build → Realtime Database"), " → ", el("strong", null, "Create Database"),
        " → lokasyon ", el("code", null, "europe-west1"), " → ", el("strong", null, '"Start in test mode"'), " → Enable.",
      ),
    ),
    el("div", { class: "setup-step" },
      el("div", { style: { fontSize: 15, marginBottom: 6 } }, "Web app ekle, config'i kopyala"),
      el("p", { style: { fontSize: 13.5, color: "#6e6147", margin: 0, lineHeight: 1.55 } },
        "→ Dişli ikonu → ", el("strong", null, "Project settings"), " → aşağıda ", el("strong", null, "Your apps"),
        " → ", el("code", null, "</>"), " (web) → isim ver → Register. Çıkan ",
        el("code", null, "firebaseConfig"), " bloğunun tamamını kopyala.",
      ),
    ),
  );

  const cfgArea = el("textarea", {
    class: "mono",
    placeholder: 'const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  databaseURL: "https://...",\n  projectId: "...",\n};',
    style: { fontSize: 12.5, minHeight: 150 },
    spellcheck: "false",
  });
  cfgArea.addEventListener("input", (e) => { cfgText = e.target.value; });

  const errorBox = el("div");
  const btn = el("button", { class: "btn-primary" }, el("span", null, "Bağlan ve Devam Et"));

  steps.append(
    el("div", { class: "setup-step" },
      el("div", { style: { fontSize: 15, marginBottom: 10 } }, "Config'i buraya yapıştır"),
      cfgArea,
      el("p", { class: "hint" }, "firebaseConfig = { ... } bloğunu olduğu gibi yapıştır; gerisini ayıklarım."),
      el("div", { style: { marginTop: 14 } }, btn),
      errorBox,
    ),
  );

  function parseConfig(text) {
    if (!text || !text.trim()) throw new Error("Config boş.");
    let t = text.trim();
    t = t.replace(/^\s*(const|let|var)\s+\w+\s*=\s*/, "").replace(/;\s*$/, "").trim();
    const start = t.indexOf("{"), end = t.lastIndexOf("}");
    if (start === -1 || end === -1) throw new Error("Süslü parantez { } bulunamadı.");
    t = t.slice(start, end + 1);
    let obj;
    try { obj = (new Function("return (" + t + ")"))(); }
    catch (e) { throw new Error("Config çözümlenemedi — kopyalarken eksik olmuş olabilir."); }
    if (!obj || typeof obj !== "object") throw new Error("Geçerli bir config değil.");
    if (!obj.databaseURL) {
      throw new Error("Config'te databaseURL eksik. Realtime Database sayfasının üstündeki https://...firebasedatabase.app adresini config'e databaseURL olarak ekle.");
    }
    return obj;
  }

  btn.addEventListener("click", () => {
    errorBox.innerHTML = "";
    let cfg;
    try { cfg = parseConfig(cfgText); }
    catch (e) { errorBox.appendChild(el("div", { class: "alert alert-error" }, e.message)); return; }
    try { initFirebase(cfg); }
    catch (e) { errorBox.appendChild(el("div", { class: "alert alert-error" }, "Firebase başlatılamadı: " + e.message)); return; }
    lsSet("fb_config", cfg);
    errorBox.innerHTML = "";
    errorBox.appendChild(el("div", { class: "alert alert-ok" },
      "Bağlandı! Devam ediyoruz. Kalıcı olması için bu config'i dosyadaki FIREBASE_CONFIG bloğuna da yapıştırabilirsin.",
    ));
    setTimeout(() => screenLogin(), 900);
  });

  card.append(header, title, subtitle, steps);
  root.append(card);
  $app.append(root);
}

// =============================================================================
//  FIREBASE INIT
// =============================================================================
let fbDb = null;
function initFirebase(cfg) {
  if (firebase.apps && firebase.apps.length) { fbDb = firebase.database(); return; }
  firebase.initializeApp(cfg);
  fbDb = firebase.database();
}

// =============================================================================
//  EKRAN: GİRİŞ
// =============================================================================
function screenLogin() {
  clear();
  const savedName = lsGet("name") || "";
  const params = new URLSearchParams(location.search);
  const initialRoom = (params.get("room") || DEFAULT_ROOM).toUpperCase();

  const root = el("div", { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "24px" } });
  const card = el("div", { class: "card", style: { width: "100%", maxWidth: 460, padding: "44px 36px" } });

  const header = el("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 32 } },
    svgStar(26),
    el("span", { class: "mono", style: { fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "#8a7a5b" } }, "Ofis Odası"),
  );
  const title = el("h1", { style: { fontSize: 38, fontWeight: 400, letterSpacing: "-0.02em", margin: 0, marginBottom: 8, lineHeight: 1.05 } }, "Selam, hazır mısın?");
  const subtitle = el("p", { style: { fontSize: 15, color: "#6e6147", margin: 0, marginBottom: 32, fontStyle: "italic" } }, "İş arkadaşlarınla aynı odaya gir, sohbet et, tic tac toe oyna.");

  const nameInput = el("input", { placeholder: "Erdal", value: savedName, autofocus: "true" });
  const roomInput = el("input", { value: initialRoom, style: { fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.1em" } });
  roomInput.addEventListener("input", (e) => { e.target.value = e.target.value.toUpperCase(); });

  const btn = el("button", { class: "btn-primary", disabled: !savedName }, el("span", null, "Odaya Gir"));
  nameInput.addEventListener("input", () => { btn.disabled = !nameInput.value.trim(); });

  const submit = () => {
    const name = nameInput.value.trim().slice(0, 20);
    const room = (roomInput.value.trim().toUpperCase().slice(0, 16) || DEFAULT_ROOM).replace(/[^A-Z0-9_-]/g, "");
    if (!name) return;
    lsSet("name", name);
    const url = new URL(location.href);
    url.searchParams.set("room", room);
    history.replaceState({}, "", url);
    screenApp({ name: name, room: room });
  };
  nameInput.addEventListener("keydown", (e) => e.key === "Enter" && submit());
  roomInput.addEventListener("keydown", (e) => e.key === "Enter" && submit());
  btn.addEventListener("click", submit);

  card.append(
    header, title, subtitle,
    el("div", { style: { marginBottom: 18 } }, el("label", { class: "label" }, "Adın"), nameInput),
    el("div", { style: { marginBottom: 28 } },
      el("label", { class: "label" }, "Oda Kodu"), roomInput,
      el("p", { class: "hint" }, "Aynı kodu giren herkes aynı odada buluşur."),
    ),
    btn,
  );
  root.append(card);
  $app.append(root);
}

// =============================================================================
//  EKRAN: UYGULAMA — oyun + sohbet
// =============================================================================
function screenApp(me) {
  clear();
  const roomRef = fbDb.ref("rooms/" + me.room);
  const boardRef = roomRef.child("board");
  const chatRef = roomRef.child("chat");
  const playersRef = roomRef.child("players");
  const presenceRef = roomRef.child("presence/" + myId);
  const presenceAllRef = roomRef.child("presence");
  const hangmanRef = roomRef.child("hangman");

  let board = emptyBoard();
  let chat = [];
  let players = {};
  let presence = {};
  let hangman = null;
  let activeTab = "game";
  let connected = true;

  // --- KALICI CHAT INPUT ---
  // Mesaj kutusunu yalnızca BİR KEZ oluşturuyoruz. render() her çağrıldığında
  // ekran yeniden çizilse bile bu eleman yok edilmiyor; böylece yazarken
  // imleç kaybolmuyor ve başkasının mesajı senin yazmanı kesmiyor.
  const chatInputEl = el("input", {
    placeholder: "Mesajını yaz...",
    maxlength: "500",
    style: { fontSize: 14, padding: "10px 14px" },
  });
  const chatSendBtn = el("button", {
    class: "mono",
    style: { padding: "0 18px", background: "#2a2418", color: "#fcf8ef", border: "none", borderRadius: 2, cursor: "pointer", fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase" },
  }, "Gönder");
  function doSendChat() {
    const val = chatInputEl.value;
    if (val && val.trim()) {
      sendMsg(val);
    }
    chatInputEl.value = "";
    chatInputEl.focus();
  }
  chatInputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); doSendChat(); }
  });
  chatSendBtn.addEventListener("click", doSendChat);

  presenceRef.set({ name: me.name, ts: firebase.database.ServerValue.TIMESTAMP });
  presenceRef.onDisconnect().remove();

  playersRef.transaction((current) => {
    current = current || {};
    if (current[myId]) { current[myId].name = me.name; return current; }
    const syms = Object.keys(current).map((k) => current[k] && current[k].symbol);
    if (syms.indexOf("X") === -1) current[myId] = { name: me.name, symbol: "X" };
    else if (syms.indexOf("O") === -1) current[myId] = { name: me.name, symbol: "O" };
    else current[myId] = { name: me.name, symbol: "spectator" };
    return current;
  });

  boardRef.transaction((cur) => {
    if (cur) return cur;
    const b = emptyBoard("X");
    b.starter = "X";
    return b;
  });

  boardRef.on("value", (snap) => {
    const v = snap.val();
    board = v ? Object.assign(emptyBoard(), v, { cells: v.cells || emptyBoard().cells }) : emptyBoard();
    render();
  });
  chatRef.on("value", (snap) => {
    const v = snap.val() || {};
    chat = Object.keys(v).map((id) => Object.assign({ id: id }, v[id]))
      .sort((a, b) => (a.t || 0) - (b.t || 0)).slice(-200);
    render();
  });
  playersRef.on("value", (snap) => { players = snap.val() || {}; render(); });
  presenceAllRef.on("value", (snap) => { presence = snap.val() || {}; render(); });
  hangmanRef.on("value", (snap) => { hangman = snap.val() || null; render(); });
  fbDb.ref(".info/connected").on("value", (snap) => { connected = !!snap.val(); renderConnDot(); });

  const mySymbol = () => {
    const p = players[myId];
    return p && p.symbol !== "spectator" ? p.symbol : null;
  };

  function play(idx) {
    const sym = mySymbol();
    if (!sym) return;
    boardRef.transaction((cur) => {
      const b = cur || emptyBoard();
      if (b.winner || b.draw) return b;
      if (b.turn !== sym) return b;
      const cells = (b.cells || emptyBoard().cells).slice();
      if (cells[idx]) return b;
      cells[idx] = sym;
      const r = checkWinner(cells);
      return {
        cells: cells,
        turn: sym === "X" ? "O" : "X",
        winner: r.winner || "",
        line: r.line || [],
        draw: !!r.draw,
        starter: b.starter || "X",
        ts: Date.now(),
      };
    });
  }
  function resetGame() {
    // Yeni oyun: bir önceki oyunda kim başladıysa bu sefer diğeri başlasın
    boardRef.transaction((cur) => {
      const prevTurn = cur && cur.cells && cur.cells.some(Boolean) ? cur.starter : (cur && cur.starter);
      // Bir önceki başlangıç X ise şimdi O, O ise X. Hiç oynanmadıysa X.
      const prevStarter = (cur && cur.starter) || "X";
      const nextStarter = prevStarter === "X" ? "O" : "X";
      const b = emptyBoard(nextStarter);
      b.starter = nextStarter;
      return b;
    });
  }
  function sendMsg(text) {
    if (!text.trim()) return;
    chatRef.push({ name: me.name, text: text.trim().slice(0, 500), t: Date.now() });
  }

  // --- HANGMAN aksiyonları ---
  function hangmanNewGame() {
    hangmanRef.set(newHangman());
  }
  function hangmanGuess(letter) {
    hangmanRef.transaction((cur) => {
      if (!cur || cur.status !== "playing") return cur;
      const guessed = cur.guessed || [];
      if (guessed.indexOf(letter) !== -1) return cur; // zaten tahmin edilmiş
      const newGuessed = guessed.concat([letter]);
      let wrong = cur.wrong || 0;
      const isInWord = cur.word.indexOf(letter) !== -1;
      if (!isInWord) wrong++;
      let status = "playing";
      if (hangmanSolved(cur.word, newGuessed)) status = "won";
      else if (wrong >= HANGMAN_MAX_WRONG) status = "lost";
      return {
        word: cur.word,
        hint: cur.hint,
        guessed: newGuessed,
        wrong: wrong,
        status: status,
        lastBy: me.name,
        ts: Date.now(),
      };
    });
  }

  function leaveRoom() {
    boardRef.off(); chatRef.off(); playersRef.off(); presenceAllRef.off(); hangmanRef.off();
    fbDb.ref(".info/connected").off();
    playersRef.child(myId).remove();
    presenceRef.remove();
    const url = new URL(location.href);
    url.searchParams.delete("room");
    history.replaceState({}, "", url);
    screenLogin();
  }
  function copyShareLink() {
    const url = location.origin + location.pathname + "?room=" + encodeURIComponent(me.room);
    navigator.clipboard && navigator.clipboard.writeText(url);
    const b = document.getElementById("copy-btn");
    if (b) { const old = b.innerHTML; b.innerHTML = "✓ Kopyalandı"; setTimeout(() => { b.innerHTML = old; }, 1800); }
  }
  function renderConnDot() {
    const d = document.getElementById("conn-dot");
    if (d) d.style.color = connected ? "#3a6b54" : "#c75d3f";
  }

  // Sadece sohbet mesaj listesini günceller — input'a, ekranın geri kalanına dokunmaz.
  // Böylece arkadaşın mesaj atınca senin yazdığın kesintiye uğramaz.
  function refreshChatMessages() {
    const scroll = document.getElementById("chat-scroll");
    if (!scroll) return;
    scroll.innerHTML = "";
    if (!chat.length) {
      scroll.appendChild(el("div", {
        style: { display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", color: "#9a8a6b", fontStyle: "italic", fontSize: 14, textAlign: "center" },
      }, "Henüz mesaj yok.", el("br"), "İlk mesajı sen yaz ✦"));
    } else {
      for (const m of chat) {
        const mine = m.name === me.name;
        const time = new Date(m.t).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
        scroll.appendChild(el("div", { class: "msg" + (mine ? " mine" : "") },
          el("div", { style: { maxWidth: "75%" } },
            el("div", { class: "msg-meta" },
              el("span", { style: { color: mine ? "#c75d3f" : "#2a2418", fontWeight: 600 } }, mine ? "sen" : m.name),
              el("span", null, "· " + time),
            ),
            el("div", { class: "msg-bubble" }, m.text),
          ),
        ));
      }
    }
    scroll.scrollTop = scroll.scrollHeight;
  }

  function render() {
    // Sohbet sekmesi açık VE ekran zaten kurulmuşsa: tam yeniden çizme.
    // Sadece mesaj listesini tazele, input'u olduğu gibi bırak (focus korunur).
    if (activeTab === "chat" && document.getElementById("chat-scroll")) {
      refreshChatMessages();
      // Online sayacı ve bağlantı noktası da güncellensin
      const cd = document.getElementById("conn-dot");
      if (cd) cd.textContent = "● " + Object.keys(presence).length;
      // Sohbet sekmesindeki mesaj sayısı rozetini güncelle
      const ct = document.getElementById("tab-chat");
      if (ct) ct.textContent = "💬 Sohbet" + (chat.length ? " · " + chat.length : "");
      return;
    }
    clear();
    let xPlayer, oPlayer;
    for (const k in players) {
      if (players[k] && players[k].symbol === "X") xPlayer = players[k].name;
      if (players[k] && players[k].symbol === "O") oPlayer = players[k].name;
    }
    const sym = mySymbol();
    const onlineCount = Object.keys(presence).length;
    const isMyTurn = sym && board.turn === sym && !board.winner && !board.draw;

    const root = el("div", { style: { padding: "24px 16px" } });
    const wrap = el("div", { style: { maxWidth: 720, margin: "0 auto" } });

    const header = el("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 12 } },
      el("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
        svgStar(22),
        el("div", null,
          el("div", { class: "mono", style: { fontSize: 10, letterSpacing: "0.22em", color: "#8a7a5b", textTransform: "uppercase" } }, "Ofis Odası · " + me.room),
          el("div", { style: { fontSize: 18, fontWeight: 500 } },
            me.name,
            el("span", { style: { color: "#9a8a6b", fontStyle: "italic", fontSize: 14 } }, " · " + (sym ? "oynuyor (" + sym + ")" : "izliyor")),
          ),
        ),
      ),
      el("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
        el("button", {
          id: "copy-btn", class: "mono",
          style: { padding: "6px 12px", background: "#fffdf8", border: "1px solid #d9cfb8", borderRadius: 2, cursor: "pointer", fontSize: 11, letterSpacing: "0.1em", color: "#2a2418" },
          onclick: copyShareLink, title: "Davet linkini kopyala",
        }, "📋 Davet Linki"),
        el("button", {
          class: "mono",
          style: { padding: "6px 10px", background: "transparent", border: "1px solid #d9cfb8", borderRadius: 2, cursor: "pointer", fontSize: 11, letterSpacing: "0.1em", color: "#6e6147" },
          onclick: leaveRoom, title: "Odadan çık",
        }, "Çık"),
        el("div", {
          id: "conn-dot", class: "mono",
          style: { fontSize: 11, color: connected ? "#3a6b54" : "#c75d3f", display: "flex", alignItems: "center", gap: 4 },
          title: connected ? "Bağlı" : "Bağlantı yok",
        }, "● " + onlineCount),
      ),
    );

    const tabsWrap = el("div", { class: "tabs" },
      el("button", { class: "tab" + (activeTab === "game" ? " active" : ""), onclick: () => { activeTab = "game"; render(); } }, "🎮 Tic Tac Toe"),
      el("button", { class: "tab" + (activeTab === "hangman" ? " active" : ""), onclick: () => { activeTab = "hangman"; render(); } }, "🔤 Adam Asmaca"),
      el("button", { id: "tab-chat", class: "tab" + (activeTab === "chat" ? " active" : ""), onclick: () => { activeTab = "chat"; render(); } }, "💬 Sohbet" + (chat.length ? " · " + chat.length : "")),
    );

    let pane;
    if (activeTab === "game") {
      const badges = el("div", { style: { display: "flex", gap: 24, marginBottom: 20 } },
        el("div", { class: "player-badge x" + (board.turn === "X" && !board.winner && !board.draw ? " active" : "") }, svgStar(14), el("span", null, xPlayer || "—")),
        el("div", { class: "player-badge o" + (board.turn === "O" && !board.winner && !board.draw ? " active" : "") }, svgCircle(14), el("span", null, oPlayer || "—")),
      );
      const boardEl = el("div", { class: "cells" });
      board.cells.forEach((val, i) => {
        const winning = board.line && board.line.indexOf(i) !== -1;
        const playable = !val && isMyTurn && sym;
        const cell = el("button", {
          class: "cell" + (playable ? " playable" : "") + (winning ? " winning" : ""),
          disabled: !playable, onclick: () => playable && play(i),
        });
        if (val === "X") cell.appendChild(svgStar(48, "#c75d3f"));
        else if (val === "O") cell.appendChild(svgCircle(48, "#3a6b54"));
        boardEl.appendChild(cell);
      });

      let txt, color, italic;
      if (board.winner) {
        txt = board.winner === sym ? "Kazandın 🎉" : ((board.winner === "X" ? xPlayer : oPlayer) || "Rakip") + " kazandı";
        color = board.winner === "X" ? "#c75d3f" : "#3a6b54"; italic = true;
      } else if (board.draw) { txt = "Berabere"; color = "#6e6147"; italic = true; }
      else if (!sym) { txt = "İzleyici modunda"; color = "#8a7a5b"; italic = false; }
      else if (isMyTurn) { txt = "Sıra sende"; color = "#2a2418"; italic = false; }
      else { txt = "Rakip oynuyor..."; color = "#8a7a5b"; italic = false; }

      const statusEl = el("div", {
        style: {
          marginTop: 24, height: 48, display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: italic ? "'Fraunces', serif" : "'JetBrains Mono', monospace",
          fontSize: italic ? "22px" : "12px", fontStyle: italic ? "italic" : "normal",
          letterSpacing: italic ? "0" : "0.15em", textTransform: italic ? "none" : "uppercase", color: color,
        },
      }, txt);

      pane = el("div", { style: { padding: "20px 0", display: "flex", flexDirection: "column", alignItems: "center" } },
        badges, boardEl, statusEl,
        el("div", { style: { marginTop: 8, paddingBottom: 24 } }, el("button", { class: "btn-ghost", onclick: resetGame }, "↻ Yeni Oyun")),
      );
    } else if (activeTab === "hangman") {
      // ----- ADAM ASMACA -----
      const inner = el("div", { style: { padding: "24px 24px 28px", display: "flex", flexDirection: "column", alignItems: "center" } });

      if (!hangman) {
        // Henüz oyun başlamamış
        inner.appendChild(el("div", {
          style: { textAlign: "center", color: "#6e6147", fontStyle: "italic", fontSize: 15, marginBottom: 20, marginTop: 20 },
        }, "Henüz oyun yok. Rastgele bir Türkçe kelime seçeyim mi?"));
        inner.appendChild(el("button", { class: "btn-primary", style: { maxWidth: 260 }, onclick: hangmanNewGame }, "Yeni Oyun Başlat"));
      } else {
        const guessed = hangman.guessed || [];
        const wrong = hangman.wrong || 0;
        const status = hangman.status || "playing";

        // İpucu
        inner.appendChild(el("div", {
          class: "mono",
          style: { fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: "#8a7a5b", marginBottom: 4 },
        }, "İpucu"));
        inner.appendChild(el("div", {
          style: { fontSize: 16, fontStyle: "italic", color: "#2a2418", marginBottom: 18 },
        }, hangman.hint || "—"));

        // Asılan adam — kademeli SVG
        const HM_PARTS = wrong;
        const gallows = el("div", { style: { marginBottom: 18 } });
        gallows.innerHTML =
          '<svg width="140" height="160" viewBox="0 0 140 160">' +
          '<line x1="20" y1="150" x2="100" y2="150" stroke="#2a2418" stroke-width="4"/>' +
          '<line x1="40" y1="150" x2="40" y2="20" stroke="#2a2418" stroke-width="4"/>' +
          '<line x1="40" y1="20" x2="95" y2="20" stroke="#2a2418" stroke-width="4"/>' +
          '<line x1="95" y1="20" x2="95" y2="38" stroke="#2a2418" stroke-width="3"/>' +
          (HM_PARTS >= 1 ? '<circle cx="95" cy="50" r="12" stroke="#c75d3f" stroke-width="3" fill="none"/>' : '') +
          (HM_PARTS >= 2 ? '<line x1="95" y1="62" x2="95" y2="100" stroke="#c75d3f" stroke-width="3"/>' : '') +
          (HM_PARTS >= 3 ? '<line x1="95" y1="72" x2="78" y2="88" stroke="#c75d3f" stroke-width="3"/>' : '') +
          (HM_PARTS >= 4 ? '<line x1="95" y1="72" x2="112" y2="88" stroke="#c75d3f" stroke-width="3"/>' : '') +
          (HM_PARTS >= 5 ? '<line x1="95" y1="100" x2="80" y2="125" stroke="#c75d3f" stroke-width="3"/>' : '') +
          (HM_PARTS >= 6 ? '<line x1="95" y1="100" x2="110" y2="125" stroke="#c75d3f" stroke-width="3"/>' : '') +
          '</svg>';
        inner.appendChild(gallows);

        // Can göstergesi
        inner.appendChild(el("div", {
          class: "mono",
          style: { fontSize: 11, letterSpacing: "0.1em", color: wrong >= 4 ? "#c75d3f" : "#6e6147", marginBottom: 16 },
        }, "Yanlış: " + wrong + " / " + HANGMAN_MAX_WRONG));

        // Kelime — kutucuklar
        const wordRow = el("div", { style: { display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center", marginBottom: 22 } });
        for (const ch of hangman.word) {
          if (ch === " ") {
            wordRow.appendChild(el("div", { style: { width: 16 } }));
            continue;
          }
          const revealed = guessed.indexOf(ch) !== -1 || status !== "playing";
          wordRow.appendChild(el("div", {
            style: {
              width: 34, height: 42, borderBottom: "3px solid #2a2418",
              display: "flex", alignItems: "center", justifyContent: "center",
              fontFamily: "'Fraunces', serif", fontSize: 26, fontWeight: 600,
              color: revealed ? (guessed.indexOf(ch) !== -1 ? "#2a2418" : "#c75d3f") : "transparent",
            },
          }, revealed ? ch : "_"));
        }
        inner.appendChild(wordRow);

        // Durum mesajı
        if (status === "won") {
          inner.appendChild(el("div", {
            style: { fontFamily: "'Fraunces', serif", fontSize: 22, fontStyle: "italic", color: "#3a6b54", marginBottom: 16 },
          }, "Bildiniz! 🎉"));
        } else if (status === "lost") {
          inner.appendChild(el("div", {
            style: { fontFamily: "'Fraunces', serif", fontSize: 22, fontStyle: "italic", color: "#c75d3f", marginBottom: 16 },
          }, "Kaybettiniz — kelime: " + hangman.word));
        }

        // Klavye — harf butonları
        if (status === "playing") {
          const kb = el("div", { style: { display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center", maxWidth: 460 } });
          for (const letter of HANGMAN_ALPHABET) {
            const used = guessed.indexOf(letter) !== -1;
            const inWord = hangman.word.indexOf(letter) !== -1;
            const btn = el("button", {
              disabled: used,
              class: "mono",
              style: {
                width: 36, height: 40, fontSize: 14, fontWeight: 600,
                border: "1px solid " + (used ? (inWord ? "#3a6b54" : "#c75d3f") : "#d9cfb8"),
                borderRadius: 2,
                background: used ? (inWord ? "#e4ede7" : "#fdebe2") : "#fffdf8",
                color: used ? (inWord ? "#3a6b54" : "#c75d3f") : "#2a2418",
                cursor: used ? "default" : "pointer",
                transition: "all 0.15s",
              },
              onclick: () => { if (!used) hangmanGuess(letter); },
            }, letter);
            kb.appendChild(btn);
          }
          inner.appendChild(kb);
        }

        // Son tahmin eden
        if (hangman.lastBy) {
          inner.appendChild(el("div", {
            class: "mono",
            style: { fontSize: 10, letterSpacing: "0.1em", color: "#9a8a6b", marginTop: 16, textTransform: "uppercase" },
          }, "Son harf: " + hangman.lastBy));
        }

        // Yeni oyun butonu
        inner.appendChild(el("div", { style: { marginTop: 20 } },
          el("button", { class: "btn-ghost", onclick: hangmanNewGame }, "↻ Yeni Kelime"),
        ));
      }
      pane = inner;
    } else {
      // ----- SOHBET -----
      // Mesaj listesi her render'da yeniden çiziliyor (yeni mesajlar için),
      // AMA input kalıcı eleman olduğu için ona hiç dokunmuyoruz.
      const scroll = el("div", { class: "chat-scroll", id: "chat-scroll" });
      if (!chat.length) {
        scroll.appendChild(el("div", {
          style: { display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", color: "#9a8a6b", fontStyle: "italic", fontSize: 14, textAlign: "center" },
        }, "Henüz mesaj yok.", el("br"), "İlk mesajı sen yaz ✦"));
      } else {
        for (const m of chat) {
          const mine = m.name === me.name;
          const time = new Date(m.t).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
          scroll.appendChild(el("div", { class: "msg" + (mine ? " mine" : "") },
            el("div", { style: { maxWidth: "75%" } },
              el("div", { class: "msg-meta" },
                el("span", { style: { color: mine ? "#c75d3f" : "#2a2418", fontWeight: 600 } }, mine ? "sen" : m.name),
                el("span", null, "· " + time),
              ),
              el("div", { class: "msg-bubble" }, m.text),
            ),
          ));
        }
      }
      // Kalıcı input ve butonu buraya YERLEŞTİRİYORUZ (yeniden oluşturmuyoruz).
      const inputBar = el("div", {
        style: { padding: "14px 16px", borderTop: "1px solid #e3d9c1", background: "#fffdf8", display: "flex", gap: 8 },
      });
      inputBar.appendChild(chatInputEl);
      inputBar.appendChild(chatSendBtn);
      pane = el("div", null, scroll, inputBar);
      setTimeout(() => { scroll.scrollTop = scroll.scrollHeight; }, 0);
    }

    const card = el("div", { class: "card", style: { overflow: "hidden" } }, tabsWrap, pane);
    const footer = el("div", {
      class: "mono",
      style: { marginTop: 16, textAlign: "center", fontSize: 10, letterSpacing: "0.2em", color: "#9a8a6b", textTransform: "uppercase" },
    }, "Gerçek zamanlı · Firebase");

    wrap.append(header, card, footer);
    root.append(wrap);
    $app.append(root);
  }

  render();
}

// =============================================================================
//  ROUTER / BAŞLATMA
// =============================================================================
function boot() {
  const cfg = resolveConfig();
  if (!cfg) { screenSetup(); return; }
  try { initFirebase(cfg); }
  catch (e) { console.error(e); screenSetup(); return; }
  screenLogin();
}

boot();
</script>
</body>
</html>
