<style>

  .btn-primary:disabled { background: #aaa090; cursor: not-allowed; }
  .btn-primary:hover:not(:disabled) { opacity: 0.92; }
  .btn-ghost {
    padding: 10px 18px; background: transparent; border: 1px solid #d9cfb8;
    border-radius: 2px; cursor: pointer; font-family: 'JetBrains Mono', monospace;

  .cell {
    width: 92px; height: 92px; background: #fcf8ef; border: none;

  }
  .cell.playable { cursor: pointer; }
  .cell.playable:hover { background: #fff3df; }
  .cell.winning { background: #fff7ec; }
  .cell svg { animation: pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
  .tabs { display: flex; border-bottom: 1px solid #e3d9c1; background: #fcf8ef; }
  .tab {
    flex: 1; padding: 16px 20px; background: transparent; border: none;
    border-bottom: 2px solid transparent; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase; color: #8a7a5b;

  .tab.active { background: #fffdf8; color: #2a2418; border-bottom-color: #c75d3f; }

  .msg { display: flex; margin-bottom: 14px; align-items: flex-end; gap: 8px; }
  .msg.mine { flex-direction: row-reverse; }
  .msg-meta {
    display: flex; gap: 8px; align-items: baseline; margin-bottom: 3px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; color: #8a7a5b; text-transform: uppercase;
  }
  .msg.mine .msg-meta { flex-direction: row-reverse; }
  .msg-bubble {
    padding: 10px 14px; border-radius: 2px; font-size: 14px; line-height: 1.5;
    word-wrap: break-word; background: #fff; color: #2a2418; border: 1px solid #e3d9c1;
  }
  .msg.mine .msg-bubble { background: #2a2418; color: #fcf8ef; border: none; }
  .player-badge {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    border: 1px solid transparent; transition: all 0.3s;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5;

  .player-badge.active { opacity: 1; }

  .player-badge.o.active { background: #e4ede7; border-color: #3a6b54; }
  .setup-step { border-left: 2px solid #d9cfb8; padding-left: 20px; margin-bottom: 22px; position: relative; }
  .setup-step::before {
    content: counter(step); counter-increment: step; position: absolute;

    color: #fff; border-radius: 50%; display: flex; align-items: center;

  .alert-error { background: #fdebe2; color: #8a3525; border: 1px solid #f0c2b2; }
  .alert-info { background: #e8e2d4; color: #5a4f38; border: 1px solid #d9cfb8; }
  .alert-ok { background: #e4ede7; color: #2f5743; border: 1px solid #bcd4c6; }
  .hint { font-size: 12px; color: #9a8a6b; margin: 8px 0 0 0; font-style: italic; }
  a { color: #c75d3f; }
  code {
    background: #efe7d8; padding: 1px 5px; border-radius: 2px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.88em;
  }
</style>

<body>
<div id="app"></div>

<!-- Firebase SDK (compat build — tek global, modül gerekmez) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// =============================================================================
//  FIREBASE AYARLARI — gömülü. Siteyi açan herkes direkt giriş ekranını görür.
// =============================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBbzZII6OS-T5F1wkU1YELvHz0FHsxXxT4",
  authDomain: "sohbet-78f7e.firebaseapp.com",
  databaseURL: "https://sohbet-78f7e-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sohbet-78f7e",
  storageBucket: "sohbet-78f7e.firebasestorage.app",
  messagingSenderId: "647364419588",
  appId: "1:647364419588:web:b51836b5def39b67785551",
  measurementId: "G-35RPWX3NFF",
};

// =============================================================================
//  AYARLAR
// =============================================================================
const DEFAULT_ROOM = "EMINEVIIM";
const STORAGE_NS = "ofis_odasi_fb_v1";
// Admin şifresi — bu şifreyi girer girmez o kişi admin olur
const ADMIN_PASSWORD = "erdalerdal";

const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(STORAGE_NS + "_" + k)); } catch { return null; } };
const lsSet = (k, v) => localStorage.setItem(STORAGE_NS + "_" + k, JSON.stringify(v));

let myId = lsGet("user_id");
if (!myId) {
  myId = "u_" + Math.random().toString(36).slice(2, 10) + "_" + Date.now().toString(36);
  lsSet("user_id", myId);
}

function resolveConfig() {
  if (FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL) return FIREBASE_CONFIG;
  const saved = lsGet("fb_config");
  if (saved && saved.databaseURL) return saved;
  return null;
}

// =============================================================================
//  OYUN MANTIĞI
// =============================================================================
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function checkWinner(cells) {
  for (const [a,b,c] of LINES) {
    if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) return { winner: cells[a], line: [a,b,c] };
  }
  if (cells.every(Boolean)) return { winner: null, line: null, draw: true };
  return { winner: null, line: null, draw: false };
}
function emptyBoard(starter) {
  // starter: yeni oyuna kim başlıyor ("X" veya "O"). Verilmezse X.
  const first = (starter === "O") ? "O" : "X";
  return { cells: ["","","","","","","","",""], turn: first, winner: "", line: [], draw: false, ts: 0 };
}

// --- HANGMAN ---
// Türkçe kelime havuzu (ipucu ile birlikte)
const HANGMAN_WORDS = [
  { w: "BİLGİSAYAR", h: "Teknoloji" },
  { w: "KAHVE", h: "İçecek" },
  { w: "TOPLANTI", h: "İş hayatı" },
  { w: "İSTANBUL", h: "Şehir" },
  { w: "ANKARA", h: "Şehir" },
  { w: "KLAVYE", h: "Ofis eşyası" },
  { w: "PROJE", h: "İş hayatı" },
  { w: "TELEFON", h: "Teknoloji" },
  { w: "MÜDÜR", h: "İş hayatı" },
  { w: "PENCERE", h: "Ev/ofis" },
  { w: "ASANSÖR", h: "Bina" },
  { w: "FATURA", h: "İş hayatı" },
  { w: "RAPOR", h: "İş hayatı" },
  { w: "MOLA", h: "İş hayatı" },
  { w: "YAZILIM", h: "Teknoloji" },
  { w: "MÜŞTERİ", h: "İş hayatı" },
  { w: "DEFTER", h: "Kırtasiye" },
  { w: "KALEM", h: "Kırtasiye" },
  { w: "SANDALYE", h: "Mobilya" },
  { w: "MASA", h: "Mobilya" },
  { w: "EKRAN", h: "Teknoloji" },
  { w: "İNTERNET", h: "Teknoloji" },
  { w: "ARABA", h: "Ulaşım" },
  { w: "OTOBÜS", h: "Ulaşım" },
  { w: "TATİL", h: "Keyif" },
  { w: "BAYRAM", h: "Özel gün" },
  { w: "ÇİLEK", h: "Meyve" },
  { w: "KARPUZ", h: "Meyve" },
  { w: "DENİZ", h: "Doğa" },
  { w: "ORMAN", h: "Doğa" },
  { w: "YAĞMUR", h: "Hava" },
  { w: "GÜNEŞ", h: "Hava" },
  { w: "KÖPEK", h: "Hayvan" },
  { w: "KEDİ", h: "Hayvan" },
  { w: "PROGRAMCI", h: "Meslek" },
  { w: "MÜHENDİS", h: "Meslek" },
  { w: "ÖĞRETMEN", h: "Meslek" },
  { w: "DOKTOR", h: "Meslek" },
  { w: "PİZZA", h: "Yemek" },
  { w: "KEBAP", h: "Yemek" },
];
const HANGMAN_ALPHABET = "ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ".split("");
const HANGMAN_MAX_WRONG = 6;

function pickHangmanWord() {
  return HANGMAN_WORDS[Math.floor(Math.random() * HANGMAN_WORDS.length)];
}
function newHangman() {
  const pick = pickHangmanWord();
  return {
    word: pick.w,
    hint: pick.h,
    guessed: [],        // tahmin edilen harfler
    wrong: 0,           // yanlış sayısı
    status: "playing",  // playing | won | lost
    lastBy: "",         // son harfi kim tahmin etti
    ts: Date.now(),
  };
}
// Bir kelimenin tamamı bilindi mi?
function hangmanSolved(word, guessed) {
  for (const ch of word) {
    if (ch === " ") continue;
    if (guessed.indexOf(ch) === -1) return false;
  }
  return true;
}

// =============================================================================
//  DOM YARDIMCILARI
// =============================================================================
const $app = document.getElementById("app");
function el(tag, attrs, ...children) {
  attrs = attrs || {};
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (k === "class") e.className = v;
    else if (k === "style") Object.assign(e.style, v);
    else if (k.slice(0,2) === "on" && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "html") e.innerHTML = v;
    else if (v != null && v !== false) e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}
function svgStar(size, color) {
  size = size || 22; color = color || "#c75d3f";
  const w = document.createElement("span");
  w.style.display = "inline-flex";
  w.innerHTML = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" style="display:block"><path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z" fill="'+color+'"/></svg>';
  return w;
}
function svgCircle(size, color) {
  size = size || 22; color = color || "#3a6b54";
  const w = document.createElement("span");
  w.style.display = "inline-flex";
  w.innerHTML = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" style="display:block"><circle cx="12" cy="12" r="7.5" stroke="'+color+'" stroke-width="2.6" fill="none"/></svg>';
  return w;
}
const clear = () => { $app.innerHTML = ""; };

// =============================================================================
//  EKRAN: KURULUM
// =============================================================================
function screenSetup() {
  clear();
  let cfgText = "";

  const root = el("div", { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "24px" } });
  const card = el("div", { class: "card", style: { width: "100%", maxWidth: 560, padding: "44px 36px" } });

  const header = el("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 24 } },
    svgStar(26),
    el("span", { class: "mono", style: { fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "#8a7a5b" } }, "Ofis Odası — İlk Kurulum"),
  );
  const title = el("h1", { style: { fontSize: 30, fontWeight: 400, letterSpacing: "-0.02em", margin: 0, marginBottom: 8, lineHeight: 1.1 } }, "Firebase'e bağlan");
  const subtitle = el("p", { style: { color: "#6e6147", margin: 0, marginBottom: 26, fontStyle: "italic" } }, "Bunu sadece bir kere yaparsın. Yaklaşık 5 dakika, kart bilgisi yok.");

  const steps = el("div", { class: "setup-steps" },
    el("div", { class: "setup-step" },
      el("div", { style: { fontSize: 15, marginBottom: 6 } }, "Firebase projesi aç"),
      el("p", { style: { fontSize: 13.5, color: "#6e6147", margin: 0, lineHeight: 1.55 } },
        "→ ", el("a", { href: "https://console.firebase.google.com", target: "_blank", rel: "noopener" }, "console.firebase.google.com"),
        " → ", el("strong", null, "Add project"), " → bir isim ver → Analytics'i kapat → Create.",
      ),
    ),
    el("div", { class: "setup-step" },
      el("div", { style: { fontSize: 15, marginBottom: 6 } }, "Realtime Database oluştur"),
      el("p", { style: { fontSize: 13.5, color: "#6e6147", margin: 0, lineHeight: 1.55 } },
        "→ Sol menü ", el("strong", null, "Build → Realtime Database"), " → ", el("strong", null, "Create Database"),
        " → lokasyon ", el("code", null, "europe-west1"), " → ", el("strong", null, '"Start in test mode"'), " → Enable.",
      ),
    ),
    el("div", { class: "setup-step" },
      el("div", { style: { fontSize: 15, marginBottom: 6 } }, "Web app ekle, config'i kopyala"),
      el("p", { style: { fontSize: 13.5, color: "#6e6147", margin: 0, lineHeight: 1.55 } },
        "→ Dişli ikonu → ", el("strong", null, "Project settings"), " → aşağıda ", el("strong", null, "Your apps"),
        " → ", el("code", null, "</>"), " (web) → isim ver → Register. Çıkan ",
        el("code", null, "firebaseConfig"), " bloğunun tamamını kopyala.",
      ),
    ),
  );

  const cfgArea = el("textarea", {
    class: "mono",
    placeholder: 'const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  databaseURL: "https://...",\n  projectId: "...",\n};',
    style: { fontSize: 12.5, minHeight: 150 },
    spellcheck: "false",
  });
  cfgArea.addEventListener("input", (e) => { cfgText = e.target.value; });

  const errorBox = el("div");
  const btn = el("button", { class: "btn-primary" }, el("span", null, "Bağlan ve Devam Et"));

  steps.append(
    el("div", { class: "setup-step" },
      el("div", { style: { fontSize: 15, marginBottom: 10 } }, "Config'i buraya yapıştır"),
      cfgArea,
      el("p", { class: "hint" }, "firebaseConfig = { ... } bloğunu olduğu gibi yapıştır; gerisini ayıklarım."),
      el("div", { style: { marginTop: 14 } }, btn),
      errorBox,
    ),
  );

  function parseConfig(text) {
    if (!text || !text.trim()) throw new Error("Config boş.");
    let t = text.trim();
    t = t.replace(/^\s*(const|let|var)\s+\w+\s*=\s*/, "").replace(/;\s*$/, "").trim();
    const start = t.indexOf("{"), end = t.lastIndexOf("}");
    if (start === -1 || end === -1) throw new Error("Süslü parantez { } bulunamadı.");
    t = t.slice(start, end + 1);
    let obj;
    try { obj = (new Function("return (" + t + ")"))(); }
    catch (e) { throw new Error("Config çözümlenemedi — kopyalarken eksik olmuş olabilir."); }
    if (!obj || typeof obj !== "object") throw new Error("Geçerli bir config değil.");
    if (!obj.databaseURL) {
      throw new Error("Config'te databaseURL eksik. Realtime Database sayfasının üstündeki https://...firebasedatabase.app adresini config'e databaseURL olarak ekle.");
    }
    return obj;
  }

  btn.addEventListener("click", () => {
    errorBox.innerHTML = "";
    let cfg;
    try { cfg = parseConfig(cfgText); }
    catch (e) { errorBox.appendChild(el("div", { class: "alert alert-error" }, e.message)); return; }
    try { initFirebase(cfg); }
    catch (e) { errorBox.appendChild(el("div", { class: "alert alert-error" }, "Firebase başlatılamadı: " + e.message)); return; }
    lsSet("fb_config", cfg);
    errorBox.innerHTML = "";
    errorBox.appendChild(el("div", { class: "alert alert-ok" },
      "Bağlandı! Devam ediyoruz. Kalıcı olması için bu config'i dosyadaki FIREBASE_CONFIG bloğuna da yapıştırabilirsin.",
    ));
    setTimeout(() => screenLogin(), 900);
  });

  card.append(header, title, subtitle, steps);
  root.append(card);
  $app.append(root);
}

// =============================================================================
//  FIREBASE INIT
// =============================================================================
let fbDb = null;
function initFirebase(cfg) {
  if (firebase.apps && firebase.apps.length) { fbDb = firebase.database(); return; }
  firebase.initializeApp(cfg);
  fbDb = firebase.database();
}

// =============================================================================
//  EKRAN: GİRİŞ
// =============================================================================
function screenLogin() {
  clear();
  const savedName = lsGet("name") || "";
  const params = new URLSearchParams(location.search);
  const initialRoom = (params.get("room") || DEFAULT_ROOM).toUpperCase();

  const root = el("div", { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "24px" } });
  const card = el("div", { class: "card", style: { width: "100%", maxWidth: 460, padding: "44px 36px" } });

  const header = el("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 32 } },
    svgStar(26),
    el("span", { class: "mono", style: { fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "#8a7a5b" } }, "Ofis Odası"),
  );
  const title = el("h1", { style: { fontSize: 38, fontWeight: 400, letterSpacing: "-0.02em", margin: 0, marginBottom: 8, lineHeight: 1.05 } }, "Selam, hazır mısın?");
  const subtitle = el("p", { style: { fontSize: 15, color: "#6e6147", margin: 0, marginBottom: 32, fontStyle: "italic" } }, "İş arkadaşlarınla aynı odaya gir, sohbet et, tic tac toe oyna.");

  const nameInput = el("input", { placeholder: "Erdal", value: savedName, autofocus: "true" });
  const roomInput = el("input", { value: initialRoom, style: { fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.1em" } });
  roomInput.addEventListener("input", (e) => { e.target.value = e.target.value.toUpperCase(); });

  const btn = el("button", { class: "btn-primary", disabled: !savedName }, el("span", null, "Odaya Gir"));
  nameInput.addEventListener("input", () => { btn.disabled = !nameInput.value.trim(); });

  const submit = () => {
    const name = nameInput.value.trim().slice(0, 20);
    const room = (roomInput.value.trim().toUpperCase().slice(0, 16) || DEFAULT_ROOM).replace(/[^A-Z0-9_-]/g, "");
    if (!name) return;
    lsSet("name", name);
    const url = new URL(location.href);
    url.searchParams.set("room", room);
    history.replaceState({}, "", url);
    screenApp({ name: name, room: room });
  };
  nameInput.addEventListener("keydown", (e) => e.key === "Enter" && submit());
  roomInput.addEventListener("keydown", (e) => e.key === "Enter" && submit());
  btn.addEventListener("click", submit);

  card.append(
    header, title, subtitle,
    el("div", { style: { marginBottom: 18 } }, el("label", { class: "label" }, "Adın"), nameInput),
    el("div", { style: { marginBottom: 28 } },
      el("label", { class: "label" }, "Oda Kodu"), roomInput,
      el("p", { class: "hint" }, "Aynı kodu giren herkes aynı odada buluşur."),
    ),
    btn,
  );
  root.append(card);
  $app.append(root);
}

// =============================================================================
//  EKRAN: UYGULAMA — oyun + sohbet
// =============================================================================
function screenApp(me) {
  clear();
  const roomRef = fbDb.ref("rooms/" + me.room);
  const boardRef = roomRef.child("board");
  const chatRef = roomRef.child("chat");
  const playersRef = roomRef.child("players");
  const presenceRef = roomRef.child("presence/" + myId);
  const presenceAllRef = roomRef.child("presence");
  const hangmanRef = roomRef.child("hangman");
  const metaRef = roomRef.child("meta");
  const notifyRef = roomRef.child("notify");
  const typingRef = roomRef.child("typing");      // kim yazıyor
  const dmRef = roomRef.child("dm");              // özel mesajlar

  let board = emptyBoard();
  let chat = [];
  let players = {};
  let presence = {};
  let hangman = null;
  let roomMeta = {};   // oda ayarları: { chatFrozen: bool, announce: string }
  let typing = {};     // { userId: { name, ts } } — şu an yazanlar
  let dms = {};        // tüm DM thread'leri
  let activeTab = "game";
  let activeDmWith = null;  // hangi kişiyle DM açık (userId)
  let connected = true;
  let isAdmin = lsGet("is_admin_" + me.room) === true;  // bu odada admin miyim
  let notifyEnabled = lsGet("notify_enabled") !== false; // bildirimler açık mı (varsayılan açık)
  let lastNotifyTs = 0;  // en son gösterilen bildirimin zamanı (tekrar göstermemek için)
  let typingTimer = null;  // yazma durumu zamanlayıcısı

  // --- KALICI CHAT INPUT ---
  // Mesaj kutusunu yalnızca BİR KEZ oluşturuyoruz. render() her çağrıldığında
  // ekran yeniden çizilse bile bu eleman yok edilmiyor; böylece yazarken
  // imleç kaybolmuyor ve başkasının mesajı senin yazmanı kesmiyor.
  const chatInputEl = el("input", {
    placeholder: "Mesajını yaz...",
    maxlength: "500",
    type: "text",
    autocomplete: "off",
    autocorrect: "off",
    autocapitalize: "off",
    spellcheck: "false",
    name: "ofis-chat-msg-nofill",
    style: { fontSize: 14, padding: "10px 14px" },
  });
  const chatSendBtn = el("button", {
    class: "mono",
    style: { padding: "0 18px", background: "#2a2418", color: "#fcf8ef", border: "none", borderRadius: 2, cursor: "pointer", fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase" },
  }, "Gönder");
  function clearChatInput() {
    // Hem value'yu hem tarayıcı autofill'ini sıfırlamak için
    chatInputEl.value = "";
    chatInputEl.setAttribute("value", "");
  }
  function doSendChat() {
    const val = chatInputEl.value;
    if (!val || !val.trim()) { clearChatInput(); return; }
    // ÖNCE kutuyu temizle
    clearChatInput();
    // SONRA mesajı gönder
    sendMsg(val);
    chatInputEl.focus();
    // Hangi sırada render gelirse gelsin kutuyu boş tut
    requestAnimationFrame(clearChatInput);
    setTimeout(clearChatInput, 0);
    setTimeout(clearChatInput, 60);
  }
  chatInputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); doSendChat(); }
  });
  // Yazarken "yazıyor..." durumunu bildir
  chatInputEl.addEventListener("input", () => {
    if (chatInputEl.value.trim()) startTyping();
    else stopTyping();
  });
  chatSendBtn.addEventListener("click", (e) => { e.preventDefault(); doSendChat(); });

  presenceRef.set({ name: me.name, ts: firebase.database.ServerValue.TIMESTAMP });
  presenceRef.onDisconnect().remove();

  // Odaya girince bildirim izni iste — sekme dışı bildirimler çalışsın
  if (notifyEnabled && ("Notification" in window) && Notification.permission === "default") {
    setTimeout(() => { try { Notification.requestPermission(); } catch (e) {} }, 1200);
  }

  playersRef.transaction((current) => {
    current = current || {};
    if (current[myId]) { current[myId].name = me.name; return current; }
    const syms = Object.keys(current).map((k) => current[k] && current[k].symbol);
    if (syms.indexOf("X") === -1) current[myId] = { name: me.name, symbol: "X" };
    else if (syms.indexOf("O") === -1) current[myId] = { name: me.name, symbol: "O" };
    else current[myId] = { name: me.name, symbol: "spectator" };
    return current;
  });

  boardRef.transaction((cur) => {
    if (cur) return cur;
    const b = emptyBoard("X");
    b.starter = "X";
    return b;
  });

  boardRef.on("value", (snap) => {
    const v = snap.val();
    board = v ? Object.assign(emptyBoard(), v, { cells: v.cells || emptyBoard().cells }) : emptyBoard();
    render();
  });
  let lastChatNotifyTs = lsGet("last_chat_notify_ts") || Date.now();
  chatRef.on("value", (snap) => {
    const v = snap.val() || {};
    chat = Object.keys(v).map((id) => Object.assign({ id: id }, v[id]))
      .sort((a, b) => (a.t || 0) - (b.t || 0)).slice(-200);
    // Sekme arka plandayken yeni mesaj geldiyse bildirim göster
    if (chat.length) {
      const last = chat[chat.length - 1];
      if (last && last.t > lastChatNotifyTs && last.uid !== myId) {
        lastChatNotifyTs = last.t;
        lsSet("last_chat_notify_ts", last.t);
        // Sadece sekme arka plandaysa VEYA sohbet sekmesinde değilsek bildir
        if (document.hidden || activeTab !== "chat") {
          showLocalNotification("💬 " + last.name, last.text || "");
        }
      } else if (last) {
        lastChatNotifyTs = Math.max(lastChatNotifyTs, last.t || 0);
      }
    }
    // Sohbet sekmesindeysem görünen mesajları okundu işaretle
    markVisibleMessagesRead();
    render();
  });
  playersRef.on("value", (snap) => { players = snap.val() || {}; render(); });
  presenceAllRef.on("value", (snap) => { presence = snap.val() || {}; render(); });
  hangmanRef.on("value", (snap) => { hangman = snap.val() || null; render(); });
  metaRef.on("value", (snap) => {
    roomMeta = snap.val() || {};
    render();
  });
  // Bildirim dinleyici — admin bildirim yolladığında herkeste tetiklenir
  notifyRef.on("value", (snap) => {
    const notif = snap.val();
    if (notif) showIncomingNotification(notif);
  });
  // "Yazıyor..." göstergesi
  typingRef.on("value", (snap) => {
    typing = snap.val() || {};
    render();
  });
  // Özel mesajlar (DM)
  dmRef.on("value", (snap) => {
    dms = snap.val() || {};
    handleIncomingDM();
    render();
  });
  // Bu kullanıcı admin tarafından atıldı mı?
  roomRef.child("kicked/" + myId).on("value", (snap) => {
    if (snap.val()) {
      // Atıldık — temizle ve giriş ekranına dön
      try {
        boardRef.off(); chatRef.off(); playersRef.off(); presenceAllRef.off();
        hangmanRef.off(); metaRef.off(); notifyRef.off(); typingRef.off(); dmRef.off();
        roomRef.child("kicked/" + myId).remove();
        presenceRef.remove();
      } catch (e) {}
      alert("Odadan çıkarıldınız.");
      const url = new URL(location.href);
      url.searchParams.delete("room");
      history.replaceState({}, "", url);
      screenLogin();
    }
  });
  fbDb.ref(".info/connected").on("value", (snap) => { connected = !!snap.val(); renderConnDot(); });

  const mySymbol = () => {
    const p = players[myId];
    return p && p.symbol !== "spectator" ? p.symbol : null;
  };

  function play(idx) {
    const sym = mySymbol();
    if (!sym) return;
    boardRef.transaction((cur) => {
      const b = cur || emptyBoard();
      if (b.winner || b.draw) return b;
      if (b.turn !== sym) return b;
      const cells = (b.cells || emptyBoard().cells).slice();
      if (cells[idx]) return b;
      cells[idx] = sym;
      const r = checkWinner(cells);
      return {
        cells: cells,
        turn: sym === "X" ? "O" : "X",
        winner: r.winner || "",
        line: r.line || [],
        draw: !!r.draw,
        starter: b.starter || "X",
        ts: Date.now(),
      };
    });
  }
  function resetGame() {
    // Yeni oyun: bir önceki oyunda kim başladıysa bu sefer diğeri başlasın
    boardRef.transaction((cur) => {
      const prevTurn = cur && cur.cells && cur.cells.some(Boolean) ? cur.starter : (cur && cur.starter);
      // Bir önceki başlangıç X ise şimdi O, O ise X. Hiç oynanmadıysa X.
      const prevStarter = (cur && cur.starter) || "X";
      const nextStarter = prevStarter === "X" ? "O" : "X";
      const b = emptyBoard(nextStarter);
      b.starter = nextStarter;
      return b;
    });
  }
  // Bir metin resim/GIF URL'i mi? (uzantıya veya bilinen servislere bakar)
  function detectImageUrl(text) {
    const t = (text || "").trim();
    if (!/^https?:\/\//i.test(t)) return null;
    if (/\s/.test(t)) return null; // boşluk varsa tek URL değildir
    // Doğrudan resim uzantısı
    if (/\.(jpe?g|png|gif|webp|bmp|svg)(\?.*)?$/i.test(t)) return t;
    // Bilinen GIF/resim servisleri
    if (/(giphy\.com\/media|media\.tenor\.com|tenor\.com\/.*\.gif|imgur\.com|i\.imgur\.com)/i.test(t)) return t;
    return null;
  }

  function sendMsg(text) {
    if (!text.trim()) return;
    // Sohbet donduruldu mu? Admin değilsen mesaj gönderemezsin.
    if (roomMeta && roomMeta.chatFrozen && !isAdmin) return;
    const trimmed = text.trim().slice(0, 800);
    const imgUrl = detectImageUrl(trimmed);
    const msg = {
      name: me.name,
      uid: myId,
      text: trimmed,
      t: Date.now(),
    };
    if (imgUrl) msg.image = imgUrl;  // resim URL'i ise işaretle
    chatRef.push(msg);
    // Mesaj gönderince yazma durumunu kaldır
    stopTyping();
  }

  // --- "YAZIYOR..." göstergesi ---
  function startTyping() {
    typingRef.child(myId).set({ name: me.name, ts: Date.now() });
    typingRef.child(myId).onDisconnect().remove();
    if (typingTimer) clearTimeout(typingTimer);
    // 4 saniye tuşa basılmazsa "yazıyor" otomatik kalksın
    typingTimer = setTimeout(stopTyping, 4000);
  }
  function stopTyping() {
    if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
    typingRef.child(myId).remove();
  }

  // --- EMOJİ REAKSİYONLARI ---
  function toggleReaction(msgId, emoji) {
    if (!msgId || !emoji) return;
    const ref = chatRef.child(msgId).child("reactions").child(emoji).child(myId);
    ref.transaction((cur) => {
      // Zaten reaksiyon verdiysem kaldır, yoksa ekle
      return cur ? null : me.name;
    });
  }

  // --- OKUNDU BİLGİSİ (mavi tik) ---
  // Görünen mesajları "okundu" olarak işaretle
  function markVisibleMessagesRead() {
    if (activeTab !== "chat") return;
    for (const m of chat) {
      if (!m.id) continue;
      if (m.uid === myId) continue; // kendi mesajım
      const readBy = m.readBy || {};
      if (!readBy[myId]) {
        chatRef.child(m.id).child("readBy").child(myId).set(me.name);
      }
    }
  }

  // --- ÖZEL MESAJ (DM) ---
  // İki kullanıcı arası benzersiz thread anahtarı (id'ler sıralı birleştirilir)
  function dmThreadKey(uidA, uidB) {
    return [uidA, uidB].sort().join("__");
  }
  function sendDM(toUid, text) {
    if (!toUid || !text.trim()) return;
    const key = dmThreadKey(myId, toUid);
    dmRef.child(key).child("messages").push({
      from: myId,
      fromName: me.name,
      text: text.trim().slice(0, 500),
      t: Date.now(),
    });
  }
  function getDMMessages(withUid) {
    const key = dmThreadKey(myId, withUid);
    const thread = dms[key];
    if (!thread || !thread.messages) return [];
    return Object.keys(thread.messages)
      .map((id) => Object.assign({ id: id }, thread.messages[id]))
      .sort((a, b) => (a.t || 0) - (b.t || 0));
  }
  // DM'de okunmamış mesaj var mı (bu kişiden)
  function dmUnreadCount(withUid) {
    const msgs = getDMMessages(withUid);
    const seenKey = "dm_seen_" + me.room + "_" + dmThreadKey(myId, withUid);
    const lastSeen = lsGet(seenKey) || 0;
    let count = 0;
    for (const m of msgs) {
      if (m.from !== myId && (m.t || 0) > lastSeen) count++;
    }
    return count;
  }
  function markDMRead(withUid) {
    const seenKey = "dm_seen_" + me.room + "_" + dmThreadKey(myId, withUid);
    lsSet(seenKey, Date.now());
  }
  // Yeni DM geldiğinde bildirim göster
  let lastDMNotifyTs = lsGet("last_dm_notify_ts") || 0;
  function handleIncomingDM() {
    let newestForMe = 0;
    let newestMsg = null;
    for (const key of Object.keys(dms)) {
      if (key.indexOf(myId) === -1) continue; // beni ilgilendirmeyen thread
      const thread = dms[key];
      if (!thread || !thread.messages) continue;
      for (const mid of Object.keys(thread.messages)) {
        const m = thread.messages[mid];
        if (m.from === myId) continue; // kendi gönderdiğim
        if ((m.t || 0) > newestForMe) { newestForMe = m.t; newestMsg = m; }
      }
    }
    if (newestMsg && newestForMe > lastDMNotifyTs) {
      lastDMNotifyTs = newestForMe;
      lsSet("last_dm_notify_ts", newestForMe);
      // Açık DM ekranı bu kişiyle değilse bildirim göster
      const isViewingThisDM = activeTab === "dm" && activeDmWith === newestMsg.from;
      if (!isViewingThisDM) {
        showLocalNotification("Özel mesaj · " + newestMsg.fromName, newestMsg.text);
      }
    }
  }

  // --- ADMIN aksiyonları ---
  function tryAdminLogin(password) {
    if (password === ADMIN_PASSWORD) {
      isAdmin = true;
      lsSet("is_admin_" + me.room, true);
      render();
      return true;
    }
    return false;
  }
  function adminLogout() {
    isAdmin = false;
    lsSet("is_admin_" + me.room, false);
    render();
  }
  function adminClearChat() {
    if (!isAdmin) return;
    if (!confirm("Tüm sohbet mesajları silinecek. Emin misin?")) return;
    chatRef.remove();
  }
  function adminToggleFreeze() {
    if (!isAdmin) return;
    const next = !(roomMeta && roomMeta.chatFrozen);
    metaRef.child("chatFrozen").set(next);
  }
  function adminDeleteMessage(msgId) {
    if (!isAdmin || !msgId) return;
    chatRef.child(msgId).remove();
  }

  // --- BİLDİRİM sistemi (herkes kullanabilir) ---
  function adminResetAllGames() {
    if (!isAdmin) return;
    if (!confirm("Tic Tac Toe ve Adam Asmaca sıfırlanacak. Emin misin?")) return;
    const fresh = emptyBoard("X"); fresh.starter = "X";
    boardRef.set(fresh);
    hangmanRef.remove();
  }
  function adminKickUser(uid) {
    if (!isAdmin || !uid || uid === myId) return;
    playersRef.child(uid).remove();
    roomRef.child("presence/" + uid).remove();
    // Atılan kişiye işaret bırak — kendi tarafında oda kapanır
    roomRef.child("kicked/" + uid).set(Date.now());
  }
  function adminSetAnnounce(text) {
    if (!isAdmin) return;
    metaRef.child("announce").set((text || "").slice(0, 200));
  }

  // --- BİLDİRİM sistemi ---
  // Tarayıcı bildirim iznini iste
  function requestNotifyPermission() {
    if (!("Notification" in window)) return;
    if (Notification.permission === "default") {
      Notification.requestPermission();
    }
  }
  // Bildirimleri aç/kapat
  function toggleNotify() {
    notifyEnabled = !notifyEnabled;
    lsSet("notify_enabled", notifyEnabled);
    if (notifyEnabled) requestNotifyPermission();
    render();
  }
  // Admin: herkese bildirim yolla
  function adminSendNotification(text) {
    if (!isAdmin) return;
    const msg = (text || "").trim();
    if (!msg) return;
    notifyRef.set({ text: msg.slice(0, 200), by: me.name, t: Date.now() });
  }
  // Gelen bildirimi göster (kişi bildirimleri açık tutuyorsa)
  function showIncomingNotification(notif) {
    if (!notif || !notif.t) return;
    if (notif.t <= lastNotifyTs) return;  // zaten gösterildi
    lastNotifyTs = notif.t;
    // Çok eski bildirimi (sayfa ilk açıldığında) gösterme — son 60 sn içindeyse göster
    if (Date.now() - notif.t > 60000) return;
    showLocalNotification("📢 " + (notif.by || "Duyuru"), notif.text || "");
  }
  // Sayfa içi açılır bildirim kutusu
  function showInAppToast(title, body) {
    const toast = el("div", {
      style: {
        position: "fixed", top: "20px", right: "20px", zIndex: "9999",
        background: "#2a2418", color: "#fcf8ef", padding: "14px 18px",
        borderRadius: 4, maxWidth: 320, boxShadow: "0 12px 40px -8px rgba(0,0,0,0.4)",
        fontFamily: "'Fraunces', serif", animation: "none",
      },
    },
      el("div", {
        class: "mono",
        style: { fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase", color: "#e8a87c", marginBottom: 4 },
      }, title),
      el("div", { style: { fontSize: 14, lineHeight: 1.4 } }, body),
    );
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.style.transition = "opacity 0.4s";
      toast.style.opacity = "0";
      setTimeout(() => { try { document.body.removeChild(toast); } catch (e) {} }, 400);
    }, 6000);
  }

  // Merkezi bildirim gösterici — hem tarayıcı (sekme dışı) hem sayfa içi.
  // Sekme arka plandayken bile tarayıcı bildirimi çıkar.
  function showLocalNotification(title, body) {
    if (!notifyEnabled) return;
    // Tarayıcı sistem bildirimi — sekme arka plandayken bile görünür
    if (("Notification" in window) && Notification.permission === "granted") {
      try {
        const n = new Notification(title, {
          body: body,
          tag: "ofis-odasi",        // aynı tag → bildirimler üst üste yığılmaz
          renotify: true,
        });
        n.onclick = function () { window.focus(); n.close(); };
      } catch (e) {}
    }
    // Sayfa içi balon — sekme öndeyse de görünsün
    showInAppToast(title, body);
  }

  // --- HANGMAN aksiyonları ---
  function hangmanNewGame() {
    hangmanRef.set(newHangman());
  }
  function hangmanGuess(letter) {
    hangmanRef.transaction((cur) => {
      if (!cur || cur.status !== "playing") return cur;
      const guessed = cur.guessed || [];
      if (guessed.indexOf(letter) !== -1) return cur; // zaten tahmin edilmiş
      const newGuessed = guessed.concat([letter]);
      let wrong = cur.wrong || 0;
      const isInWord = cur.word.indexOf(letter) !== -1;
      if (!isInWord) wrong++;
      let status = "playing";
      if (hangmanSolved(cur.word, newGuessed)) status = "won";
      else if (wrong >= HANGMAN_MAX_WRONG) status = "lost";
      return {
        word: cur.word,
        hint: cur.hint,
        guessed: newGuessed,
        wrong: wrong,
        status: status,
        lastBy: me.name,
        ts: Date.now(),
      };
    });
  }

  function leaveRoom() {
    boardRef.off(); chatRef.off(); playersRef.off(); presenceAllRef.off(); hangmanRef.off(); metaRef.off(); notifyRef.off(); typingRef.off(); dmRef.off();
    fbDb.ref(".info/connected").off();
    playersRef.child(myId).remove();
    presenceRef.remove();
    const url = new URL(location.href);
    url.searchParams.delete("room");
    history.replaceState({}, "", url);
    screenLogin();
  }
  function copyShareLink() {
    const url = location.origin + location.pathname + "?room=" + encodeURIComponent(me.room);
    navigator.clipboard && navigator.clipboard.writeText(url);
    const b = document.getElementById("copy-btn");
    if (b) { const old = b.innerHTML; b.innerHTML = "✓ Kopyalandı"; setTimeout(() => { b.innerHTML = old; }, 1800); }
  }

  // Bildirim gönderme penceresi (modal)
  function openNotificationDialog() {
    const overlay = el("div", { style: {
      position: "fixed", inset: "0", background: "rgba(42,36,24,0.55)",
      display: "flex", alignItems: "center", justifyContent: "center",
      zIndex: "10000", padding: "24px",
    }});
    const close = () => { if (overlay.parentNode) overlay.remove(); };
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

    const box = el("div", { class: "card", style: { width: "100%", maxWidth: 420, padding: "28px 28px 24px" } });
    box.appendChild(el("div", { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 6 } },
      el("span", { style: { fontSize: 20 } }, "🔔"),
      el("div", { class: "mono", style: { fontSize: 11, letterSpacing: "0.2em", textTransform: "uppercase", color: "#8a7a5b" } }, "Bildirim Yolla"),
    ));
    box.appendChild(el("p", { style: { fontSize: 13.5, color: "#6e6147", fontStyle: "italic", margin: "0 0 16px 0" } },
      "Bu bildirim odadaki herkese anında gider. Bildirimi kapatmış olanlar görmez."));

    const inp = el("input", { type: "text", placeholder: "Örn: Toplantı 5 dk içinde başlıyor", maxlength: "140", autocomplete: "off" });
    box.appendChild(inp);

    const btnRow = el("div", { style: { display: "flex", gap: 8, marginTop: 16 } });
    const sendBtn = el("button", { class: "btn-primary", style: { flex: "1" } }, "Gönder");
    const cancelBtn = el("button", {
      class: "mono",
      style: { padding: "0 18px", background: "transparent", border: "1px solid #d9cfb8", borderRadius: 2, cursor: "pointer", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: "#6e6147" },
    }, "İptal");
    const doSend = () => {
      const t = inp.value.trim();
      if (!t) { inp.focus(); return; }
      // Herkese bildirim yolla — notifyRef'e yazınca herkesin listener'ı tetiklenir
      notifyRef.set({ text: t.slice(0, 200), by: me.name, t: Date.now() });
      close();
    };
    sendBtn.addEventListener("click", doSend);
    cancelBtn.addEventListener("click", close);
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") doSend(); });
    btnRow.appendChild(sendBtn);
    btnRow.appendChild(cancelBtn);
    box.appendChild(btnRow);

    overlay.appendChild(box);
    document.body.appendChild(overlay);

  // Sadece sohbet mesaj listesini günceller — input'a, ekranın geri kalanına dokunmaz.
  // Böylece arkadaşın mesaj atınca senin yazdığın kesintiye uğramaz.
  // Tek bir sohbet mesajı elemanı üretir. Reaksiyon, okundu tiki, admin silme dahil.
  const REACTION_EMOJIS = ["👍", "❤️", "😂", "🎉", "😮"];
  function buildMessageEl(m) {
    const mine = m.name === me.name;
    const time = new Date(m.t).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });

    // Okundu tiki — sadece kendi mesajlarımda göster
    let tickEl = null;
    if (mine && m.id) {
      const readBy = m.readBy || {};
      const readers = Object.keys(readBy).filter((uid) => uid !== myId);
      const isRead = readers.length > 0;
      tickEl = el("span", {
        title: isRead ? ("Okuyan: " + readers.map((u) => readBy[u]).join(", ")) : "İletildi",
        style: { fontSize: 11, marginLeft: 4, color: isRead ? "#4a90d9" : "#9a8a6b", letterSpacing: "-2px" },
      }, "✓✓");
    }

    const metaRow = el("div", { class: "msg-meta" },
      el("span", { style: { color: mine ? "#c75d3f" : "#2a2418", fontWeight: 600 } }, mine ? "sen" : m.name),
      el("span", null, "· " + time),
      tickEl,
    );

    // Mesaj baloncuğu — resim URL'i ise resmi göster, değilse metin
    let bubble;
    if (m.image) {
      bubble = el("div", { class: "msg-bubble", style: { padding: "4px", overflow: "hidden" } });
      const img = el("img", {
        src: m.image,
        style: {
          maxWidth: "240px", maxHeight: "240px", borderRadius: "3px",
          display: "block", cursor: "pointer", objectFit: "cover",
        },
        onclick: () => { window.open(m.image, "_blank"); },
      });
      // Resim yüklenemezse linke düş
      img.addEventListener("error", () => {
        bubble.innerHTML = "";
        bubble.style.padding = "10px 14px";
        bubble.appendChild(el("a", {
          href: m.image, target: "_blank", rel: "noopener",
          style: { color: mine ? "#e8a87c" : "#c75d3f", wordBreak: "break-all", fontSize: "13px" },
        }, m.image));
      });
      bubble.appendChild(img);
    } else {
      bubble = el("div", { class: "msg-bubble" }, m.text);
    }

    // Reaksiyon rozetleri (mevcut reaksiyonları göster)
    const reactions = m.reactions || {};
    const reactRow = el("div", { style: { display: "flex", gap: 4, marginTop: 4, flexWrap: "wrap", justifyContent: mine ? "flex-end" : "flex-start" } });
    for (const emoji of Object.keys(reactions)) {
      const reactors = reactions[emoji] || {};
      const count = Object.keys(reactors).length;
      if (count === 0) continue;
      const iReacted = !!reactors[myId];
      reactRow.appendChild(el("button", {
        title: Object.keys(reactors).map((u) => reactors[u]).join(", "),
        style: {
          fontSize: 11, padding: "1px 6px", borderRadius: 10, cursor: "pointer",
          border: "1px solid " + (iReacted ? "#c75d3f" : "#e3d9c1"),
          background: iReacted ? "#fdebe2" : "#fffdf8", color: "#2a2418",
        },
        onclick: () => { if (m.id) toggleReaction(m.id, emoji); },
      }, emoji + " " + count));
    }

    // Reaksiyon ekleme butonu (😊 → emoji seçici)
    const addReactBtn = el("button", {
      title: "Tepki ver",
      style: {
        width: 22, height: 22, minWidth: 22, padding: 0, borderRadius: "50%",
        border: "1px solid #e3d9c1", background: "#fffdf8", cursor: "pointer",
        fontSize: 11, lineHeight: "1", color: "#9a8a6b",
      },
      onclick: (e) => {
        e.stopPropagation();
        openEmojiPicker(e.currentTarget, m.id);
      },
    }, "+");

    const bubbleWrap = el("div", { style: { maxWidth: "75%" } }, metaRow, bubble, reactRow);

    const rowChildren = [bubbleWrap];
    // Reaksiyon ekle butonu — baloncuğun yanında
    rowChildren.push(el("div", { style: { display: "flex", alignItems: "center" } }, addReactBtn));

    // Admin: silme butonu
    if (isAdmin && m.id) {
      const delBtn = el("button", {
        title: "Mesajı sil",
        style: {
          width: 22, height: 22, minWidth: 22, padding: 0, borderRadius: "50%",
          border: "1px solid #e3d9c1", background: "#fffdf8", cursor: "pointer",
          color: "#c75d3f", fontSize: 12, lineHeight: "1", display: "flex",
          alignItems: "center", justifyContent: "center", alignSelf: "center",
        },
        onclick: () => { adminDeleteMessage(m.id); },
      }, "✕");
      rowChildren.push(el("div", { style: { display: "flex", alignItems: "center" } }, delBtn));
    }
    return el("div", { class: "msg" + (mine ? " mine" : "") }, rowChildren);
  }

  function refreshChatMessages() {
    const scroll = document.getElementById("chat-scroll");
    if (!scroll) return;
    scroll.innerHTML = "";
    if (!chat.length) {
      scroll.appendChild(el("div", {
        style: { display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", color: "#9a8a6b", fontStyle: "italic", fontSize: 14, textAlign: "center" },
      }, "Henüz mesaj yok.", el("br"), "İlk mesajı sen yaz ✦"));
    } else {
      for (const m of chat) {
        scroll.appendChild(buildMessageEl(m));
      }
    }
    scroll.scrollTop = scroll.scrollHeight;
  }

  // "Yazıyor..." satırını günceller (id'li typing-bar elemanını)
  function updateTypingBar() {
    const bar = document.getElementById("typing-bar");
    if (!bar) return;
    const names = [];
    const nowTs = Date.now();
    for (const uid of Object.keys(typing)) {
      if (uid === myId) continue;
      const t = typing[uid];
      if (t && t.name && (nowTs - (t.ts || 0) < 6000)) names.push(t.name);
    }
    if (!names.length) { bar.textContent = ""; return; }
    if (names.length === 1) bar.textContent = names[0] + " yazıyor...";
    else if (names.length === 2) bar.textContent = names.join(" ve ") + " yazıyor...";
    else bar.textContent = names.length + " kişi yazıyor...";
  }

      class: "mono",
      style: { marginTop: 16, textAlign: "center", fontSize: 10, letterSpacing: "0.2em", color: "#9a8a6b", textTransform: "uppercase" },
    }, "Gerçek zamanlı · Firebase");

    // Duyuru bandı — admin bir duyuru yazdıysa herkese görünür
    let announceBar = null;
    if (roomMeta && roomMeta.announce && roomMeta.announce.trim()) {
      announceBar = el("div", {
        style: {
          background: "#2a2418", color: "#fcf8ef", padding: "12px 18px",
          borderRadius: 3, marginBottom: 14, display: "flex", alignItems: "center", gap: 10,
          fontSize: 14,
        },
      },
        el("span", { style: { fontSize: 16 } }, "📢"),
        el("span", { style: { fontStyle: "italic" } }, roomMeta.announce),
      );
    }

    // Online kullanıcılar şeridi — yeşil noktayla, isme tıklayınca DM açılır
    const onlineBar = el("div", {
      style: {
        background: "#fffdf8", border: "1px solid #d9cfb8", borderRadius: 3,
        padding: "10px 14px", marginBottom: 14, display: "flex",
        alignItems: "center", gap: 10, flexWrap: "wrap",
      },
    });
    onlineBar.appendChild(el("span", {
      class: "mono",
      style: { fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase", color: "#8a7a5b" },
    }, "Online"));
    const onlineUids = Object.keys(presence);
    if (!onlineUids.length) {
      onlineBar.appendChild(el("span", { style: { fontSize: 13, color: "#9a8a6b", fontStyle: "italic" } }, "Kimse yok"));
    } else {
      for (const uid of onlineUids) {
        const pname = (presence[uid] && presence[uid].name) || "—";
        const isMe = uid === myId;
        const unread = isMe ? 0 : dmUnreadCount(uid);
        const chip = el("button", {
          title: isMe ? "Sen" : (pname + " — DM göndermek için tıkla"),
          style: {
            display: "flex", alignItems: "center", gap: 6, padding: "4px 10px",
            borderRadius: 14, border: "1px solid " + (isMe ? "#d9cfb8" : "#e3d9c1"),
            background: isMe ? "#f0ebdf" : "#fcf8ef",
            cursor: isMe ? "default" : "pointer", fontSize: 13, color: "#2a2418",
            fontFamily: "'Fraunces', serif",
          },
          onclick: isMe ? null : (() => { activeTab = "dm"; activeDmWith = uid; markDMRead(uid); render(true); }),
        },
          el("span", { style: { width: 8, height: 8, borderRadius: "50%", background: "#3a6b54", display: "inline-block" } }),
          el("span", null, isMe ? pname + " (sen)" : pname),
        );
        if (unread) {
          chip.appendChild(el("span", {
            class: "mono",
            style: {
              background: "#c75d3f", color: "#fff", fontSize: 10, minWidth: 16, height: 16,
              borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 4px",
            },
          }, String(unread)));
        }
        onlineBar.appendChild(chip);
      }
    }

    const piecesBefore = [header];
    if (announceBar) piecesBefore.push(announceBar);
    piecesBefore.push(onlineBar, card, footer);
    wrap.append.apply(wrap, piecesBefore);
    root.append(wrap);
    $app.append(root);
  }

  render();
}

// =============================================================================
//  ROUTER / BAŞLATMA
// =============================================================================
function boot() {
  const cfg = resolveConfig();
  if (!cfg) { screenSetup(); return; }
  try { initFirebase(cfg); }
  catch (e) { console.error(e); screenSetup(); return; }
  screenLogin();
}

boot();
</script>
</body>
</html>
